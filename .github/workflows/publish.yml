name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'staccDOTsol/unreal-agent'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - run: make test check
      - name: Publish the harness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="ci-${GITHUB_SHA::7}"
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "harness" \
            --notes "$(cat <<EOF
The harness.

Module \`github.com/unreallabsai/unreal-agent\`. Library in \`harness/\`.

This tag is that tree. The source archive is the delivery.
EOF
)"
