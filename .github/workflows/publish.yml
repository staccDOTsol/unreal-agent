name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-windows:
    if: github.repository == 'staccDOTsol/unreal-agent'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - run: make test check
      - name: Build Linux and Windows archives
        run: |
          set -euo pipefail
          version="${GITHUB_SHA::7}"
          mkdir -p dist
          for target_os in linux windows; do
            for target_arch in amd64 arm64; do
              archive="unreal-agent-runner_${version}_${target_os}_${target_arch}"
              mkdir -p "dist/$archive"
              bin="unreal-agent-runner"
              if [ "$target_os" = windows ]; then
                bin="unreal-agent-runner.exe"
              fi
              CGO_ENABLED=0 GOOS="$target_os" GOARCH="$target_arch" go build -mod=readonly -trimpath \
                -o "dist/$archive/$bin" ./cmd/unreal-agent-runner
              cp LICENSE "dist/$archive/"
              tar -czf "dist/$archive.tar.gz" -C "dist/$archive" "$bin" LICENSE
            done
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-windows
          path: dist/*.tar.gz
          if-no-files-found: error

  darwin:
    if: github.repository == 'staccDOTsol/unreal-agent'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Import Developer ID
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${MAC_CERT_P12}" ] || [ -z "${MAC_CERT_PASSWORD}" ]; then
            echo "MAC_CERT_P12 and MAC_CERT_PASSWORD must be set on this repo"
            exit 1
          fi
          cert="$RUNNER_TEMP/developer_id.p12"
          keychain="$RUNNER_TEMP/build.keychain-db"
          keychain_pass="$(openssl rand -hex 16)"
          printf '%s' "$MAC_CERT_P12" | base64 -D > "$cert"
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security create-keychain -p "$keychain_pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_pass" "$keychain"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain"
          security import "$cert" -k "$keychain" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_pass" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -s "$keychain"
          security find-identity -v -p codesigning
      - name: Build, sign, and notarize macOS
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_ID}" ] || [ -z "${APPLE_APP_SPECIFIC_PASSWORD}" ] || [ -z "${APPLE_TEAM_ID}" ]; then
            echo "APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, and APPLE_TEAM_ID must be set on this repo"
            exit 1
          fi
          identity="$(security find-identity -v -p codesigning | awk -F '"' '/Developer ID Application/{print $2; exit}')"
          test -n "$identity"
          version="${GITHUB_SHA::7}"
          mkdir -p dist "$RUNNER_TEMP/notarize"
          for target_arch in arm64 amd64; do
            archive="unreal-agent-runner_${version}_darwin_${target_arch}"
            mkdir -p "dist/$archive"
            CGO_ENABLED=0 GOOS=darwin GOARCH="$target_arch" go build -mod=readonly -trimpath \
              -o "dist/$archive/unreal-agent-runner" ./cmd/unreal-agent-runner
            codesign --force --sign "$identity" --options runtime --timestamp "dist/$archive/unreal-agent-runner"
            codesign --verify --strict --verbose=2 "dist/$archive/unreal-agent-runner"
            cp LICENSE "dist/$archive/"
            cp "dist/$archive/unreal-agent-runner" "$RUNNER_TEMP/notarize/unreal-agent-runner_${target_arch}"
            tar -czf "dist/$archive.tar.gz" -C "dist/$archive" unreal-agent-runner LICENSE
          done
          ditto -c -k --keepParent "$RUNNER_TEMP/notarize" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: darwin
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    if: github.repository == 'staccDOTsol/unreal-agent'
    needs: [linux-windows, darwin]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="ci-${GITHUB_SHA::7}"
          (cd dist && sha256sum ./*.tar.gz > SHA256SUMS)
          gh release create "$tag" dist/*.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "harness" \
            --notes "Windows, Linux, and macOS. The macOS binaries are Developer ID signed and notarized."
