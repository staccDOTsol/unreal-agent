name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mac:
    if: github.repository == 'staccDOTsol/unreal-agent'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - run: make test check
      - name: Import Developer ID
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${MAC_CERT_P12}" ] || [ -z "${MAC_CERT_PASSWORD}" ]; then
            echo "MAC_CERT_P12 and MAC_CERT_PASSWORD must be set on this repo"
            exit 1
          fi
          cert="$RUNNER_TEMP/developer_id.p12"
          keychain="$RUNNER_TEMP/build.keychain-db"
          keychain_pass="$(openssl rand -hex 16)"
          printf '%s' "$MAC_CERT_P12" | base64 -D > "$cert"
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security create-keychain -p "$keychain_pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_pass" "$keychain"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain"
          security import "$cert" -k "$keychain" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_pass" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -s "$keychain"
          security find-identity -v -p codesigning
      - name: Build, sign, and notarize the macOS disk image
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_ID}" ] || [ -z "${APPLE_APP_SPECIFIC_PASSWORD}" ] || [ -z "${APPLE_TEAM_ID}" ]; then
            echo "APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, and APPLE_TEAM_ID must be set on this repo"
            exit 1
          fi
          identity="$(security find-identity -v -p codesigning | awk -F '"' '/Developer ID Application/{print $2; exit}')"
          test -n "$identity"
          version="${GITHUB_SHA::7}"
          mkdir -p dist "$RUNNER_TEMP/bins"
          for arch in arm64 amd64; do
            CGO_ENABLED=0 GOOS=darwin GOARCH="$arch" go build -mod=readonly -trimpath \
              -o "$RUNNER_TEMP/bins/unreal-agent-runner_$arch" ./cmd/unreal-agent-runner
          done
          lipo -create "$RUNNER_TEMP/bins/unreal-agent-runner_arm64" "$RUNNER_TEMP/bins/unreal-agent-runner_amd64" \
            -output "$RUNNER_TEMP/bins/unreal-agent-runner"
          codesign --force --sign "$identity" --options runtime --timestamp "$RUNNER_TEMP/bins/unreal-agent-runner"
          codesign --verify --strict --verbose=2 "$RUNNER_TEMP/bins/unreal-agent-runner"
          root="$RUNNER_TEMP/installer"
          rm -rf "$root"
          mkdir -p "$root"
          cp "$RUNNER_TEMP/bins/unreal-agent-runner" LICENSE "$root/"
          dmg="dist/unreal-agent-plus_${version}.dmg"
          hdiutil create -volname "unreal-agent++" -srcfolder "$root" -ov -format UDZO "$dmg"
          codesign --force --sign "$identity" --timestamp "$dmg"
          xcrun notarytool submit "$dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$dmg"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mac-dmg
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    if: github.repository == 'staccDOTsol/unreal-agent'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Build the Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ github.sha }}".Substring(0, 7)
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -mod=readonly -trimpath -o packaging\windows\unreal-agent-runner.exe .\cmd\unreal-agent-runner
          $is = Join-Path $env:RUNNER_TEMP "innosetup.exe"
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-6_4_1/innosetup-6.4.1.exe" -OutFile $is
          Start-Process $is -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" -Wait
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVersion=$version" packaging\windows\unreal-agent.iss
          if (-not (Test-Path "dist\unreal-agent-plus_${version}_windows_amd64.exe")) { exit 1 }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: win-setup
          path: dist/*.exe
          if-no-files-found: error

  publish:
    if: github.repository == 'staccDOTsol/unreal-agent'
    needs: [mac, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish the installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="ci-${GITHUB_SHA::7}"
          (cd dist && sha256sum ./*.dmg ./*.exe > SHA256SUMS)
          gh release create "$tag" dist/*.dmg dist/*.exe dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "harness" \
            --notes "The harness. macOS is a signed, notarized disk image. Windows is an installer."
